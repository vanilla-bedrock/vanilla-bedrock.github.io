<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121212">
  <title>Offline - Vanilla Bedrock</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#121212;color:#e0e0e0;font-family:monospace;text-align:center}
    main{max-width:520px;padding:32px;border:4px solid #000;background:#202020;box-shadow:8px 8px #000}
    h1{color:#ffaa00;font-size:clamp(22px,6vw,34px)}p{font-size:18px;line-height:1.5}
    a,button{display:inline-block;margin:8px;padding:12px 18px;background:#7aa53b;color:#fff;border:3px solid #000;font: bold 14px monospace;text-decoration:none;cursor:pointer}
  </style>
</head>
<body><main>
  <h1>YOU ARE OFFLINE</h1>
  <p>Your connection to the Overworld has been interrupted. Reconnect to the internet and try again.</p>
  <button onclick="location.reload()">TRY AGAIN</button>
  <p>Vanilla Bedrock Enhanced</p>
</main></body>
</html>
